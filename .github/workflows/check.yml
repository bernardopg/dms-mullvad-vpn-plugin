name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      qml:
        description: Run real DMS QML validation on a prepared Linux desktop runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: scripts/check --core
  qml:
    if: github.event_name == 'workflow_dispatch' && inputs.qml
    runs-on: [self-hosted, Linux, dms-1.6.2]
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check
